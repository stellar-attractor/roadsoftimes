<style>
.rot-places *, .rot-places *::before, .rot-places *::after { box-sizing: border-box; margin: 0; padding: 0; }
.rot-places { font-family: 'PT Sans', sans-serif; color: #c8c0a8; }

/* TOOLBAR */
.rot-places .toolbar {
  padding: 10px 0; font-size: 11px; color: #9a8c70; letter-spacing: 1px;
  display: flex; align-items: center; justify-content: space-between;
  flex-wrap: wrap; gap: 10px; border-bottom: 1px solid #1a1a0e; margin-bottom: 16px;
}
.rot-places .toolbar-left { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.rot-places .toolbar-right { display: flex; align-items: center; gap: 10px; }
.rot-places .view-toggle { display: flex; gap: 6px; }
.rot-places .view-btn {
  background: none; border: 1px solid #2a2510; color: #9a8c70; cursor: pointer;
  padding: 4px 10px; border-radius: 3px; font-size: 13px; line-height: 1.4;
  transition: color .15s, border-color .15s; font-family: 'PT Sans', sans-serif;
}
.rot-places .view-btn.active, .rot-places .view-btn:hover { color: #c9a84c; border-color: #8a6f2e; }
.rot-places .search-box {
  background: #12120c; border: 1px solid #2a2510; color: #c8c0a8;
  font-family: 'PT Sans', sans-serif; font-size: 13px; padding: 4px 10px;
  border-radius: 3px; outline: none; transition: border-color .15s; width: 200px;
}
.rot-places .search-box:focus { border-color: #c9a84c; }

/* ── GRID VIEW ── */
.rot-places .rp-container.view-grid {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
}
.rot-places .view-grid .rp-card {
  background: #1a1a0e; border: 1px solid #252418; overflow: hidden;
  cursor: pointer; transition: border-color 0.2s; display: flex; flex-direction: column; position: relative;
}
.rot-places .view-grid .rp-card:hover { border-color: #8a6f2e; }
.rot-places .view-grid .rp-photo {
  height: 160px; background: #232318; overflow: hidden;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.rot-places .view-grid .rp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform 0.4s ease; }
.rot-places .view-grid .rp-card:hover .rp-photo img { transform: scale(1.05); }
.rot-places .view-grid .rp-photo .rp-no-photo {
  font-family: 'Orbitron', sans-serif; font-size: 9px; color: #2a2510; letter-spacing: 2px;
}
.rot-places .view-grid .rp-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 6px; }
.rot-places .view-grid .rp-name { font-family: 'Oswald', sans-serif; font-size: 16px; font-weight: 500; color: #e8e0cc; line-height: 1.25; margin-bottom: 2px; }
.rot-places .view-grid .rp-loc { font-size: 11px; color: #7a7060; }

/* ── LIST VIEW ── */
.rot-places .rp-container.view-list { display: flex; flex-direction: column; }
.rot-places .view-list .rp-card {
  display: flex; flex-direction: row; align-items: stretch;
  border-bottom: 1px solid #1a1a0e; padding: 14px 0; gap: 16px;
  transition: background .15s; cursor: pointer;
}
.rot-places .view-list .rp-card:hover { background: #0d0d08; }
.rot-places .view-list .rp-photo {
  width: 130px; min-width: 130px; height: 86px; background: #080806;
  overflow: hidden; display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; border-radius: 2px;
}
.rot-places .view-list .rp-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rot-places .view-list .rp-photo .rp-no-photo { font-family: 'Orbitron', sans-serif; font-size: 8px; color: #2a2510; letter-spacing: 2px; }
.rot-places .view-list .rp-body { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.rot-places .view-list .rp-name { font-size: 15px; font-weight: 700; color: #e0d8c0; line-height: 1.3; }
.rot-places .view-list .rp-loc { font-size: 12px; color: #7ab0b0; }

/* ── TABLE VIEW ── */
.rot-places .rp-container.view-table { width: 100%; }
.rot-places .rp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.rot-places .rp-table th {
  text-align: left; font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase;
  color: #9a8c70; padding: 8px 12px; border-bottom: 1px solid #2a2510;
  background: #0d0d08; font-weight: normal; white-space: nowrap; cursor: pointer; user-select: none;
}
.rot-places .rp-table th:hover { color: #c9a84c; }
.rot-places .rp-table th.sorted { color: #c9a84c; }
.rot-places .rp-table td { padding: 9px 12px; border-bottom: 1px solid #161610; color: #c8c0a8; vertical-align: middle; }
.rot-places .rp-table tr.rp-row { cursor: pointer; transition: background .12s; }
.rot-places .rp-table tr.rp-row:hover { background: #131309; }
.rot-places .rp-table tr.rp-row.rp-selected { background: #1a1a0a; border-left: 2px solid #c9a84c; }
.rot-places .rp-table td.rp-t-name { font-weight: 700; color: #e0d8c0; }
.rot-places .rp-table td.rp-t-loc { color: #7ab0b0; }

/* ── DETAIL PANEL ── */
.rot-places .rp-detail { display: none; padding: 12px 0 2px; }
.rot-places .rp-detail.open { display: block; }
.rot-places .rp-detail-card {
  background: #0d0d08; border: 1px solid #2a2510; border-radius: 4px;
  overflow: hidden; display: flex; flex-direction: row;
}
.rot-places .rp-detail-photo {
  width: 200px; min-width: 200px; background: #080806;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0; overflow: hidden; align-self: stretch;
}
.rot-places .rp-detail-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rot-places .rp-detail-photo .rp-no-photo { font-family: 'Orbitron', sans-serif; font-size: 9px; color: #2a2510; letter-spacing: 2px; }
.rot-places .rp-detail-body { flex: 1; display: flex; flex-direction: column; gap: 8px; padding: 16px 20px; min-width: 0; }
.rot-places .rp-detail-name { font-size: 17px; font-weight: 700; color: #e0d8c0; line-height: 1.3; text-decoration: none; display: block; }
.rot-places a.rp-detail-name:hover { color: #f0e8d0; text-decoration: underline; }
.rot-places .rp-detail-meta {
  display: flex; align-items: baseline; gap: 0; flex-wrap: wrap;
  font-size: 12px; color: #9a8c70;
}
.rot-places .rp-detail-meta .sep { color: #3a3020; }
.rot-places .rp-detail-meta b { color: #c8c0a8; font-weight: normal; }
.rot-places .rp-detail-meta a { color: #c9a84c; text-decoration: none; }
.rot-places .rp-detail-meta a:hover { text-decoration: underline; }
.rot-places .rp-detail-meta a.map { color: #70b0a8; }
.rot-places .rp-detail-meta a.landing { color: #a0c080; }

.rot-places .rp-empty { padding: 60px; text-align: center; color: #3a3020; font-size: 13px; letter-spacing: 1px; }
</style>

<div class="rot-places">
  <div class="toolbar">
    <div class="toolbar-left">
      <span id="rp-count"></span>
      <input class="search-box" id="rp-search" type="text" placeholder="Поиск места…" oninput="rpRender()">
    </div>
    <div class="toolbar-right">
      <div class="view-toggle">
        <button class="view-btn active" id="rp-btn-grid"  onclick="rpSetView('grid')">⊞ Сетка</button>
        <button class="view-btn"        id="rp-btn-list"  onclick="rpSetView('list')">☰ Список</button>
        <button class="view-btn"        id="rp-btn-table" onclick="rpSetView('table')">⊟ Таблица</button>
      </div>
    </div>
  </div>
  <div class="rp-container view-grid" id="rp-container"></div>
  <div class="rp-detail" id="rp-detail"></div>
  <div class="rp-empty" id="rp-empty" style="display:none">Ничего не найдено.</div>
</div>

<script src="https://cdn.roadsoftimes.com/js/media-runtime.js?v=fe5"></script>
<script>
//<![CDATA[
(function(){
  var MEDIA_CDN = 'https://media.roadsoftimes.com';
  var MEDIA_CDN_FALLBACK = 'https://media-roadsoftimes.pages.dev';
  var DB_CDN = MEDIA_CDN + '/db'; // JSON catalogs (Epic #47)
  var DB  = DB_CDN + '/places.json';
  var all = [], filtered = [], selectedId = null;
  var currentView = 'grid';
  var tblSort = { col: 'name', asc: true };
  try { currentView = localStorage.getItem('rot-places-view') || 'grid'; } catch(e){}

  fetch(DB).then(function(r){ return r.json(); }).then(function(data){
    all = data;
    applyView(currentView);
    rpRender();
  }).catch(function(){ document.getElementById('rp-empty').style.display = 'block'; });

  window.rpSetView = function(v){
    currentView = v;
    try { localStorage.setItem('rot-places-view', v); } catch(e){}
    selectedId = null;
    applyView(v);
    rpRender();
  };

  function applyView(v){
    document.getElementById('rp-container').className = 'rp-container view-' + v;
    ['grid','list','table'].forEach(function(x){
      document.getElementById('rp-btn-' + x).classList.toggle('active', x === v);
    });
    document.getElementById('rp-detail').className = 'rp-detail';
  }

  window.rpRender = function(){
    var q = (document.getElementById('rp-search').value || '').trim().toLowerCase();
    filtered = all.filter(function(r){
      if (!q) return true;
      return (r.name||'').toLowerCase().includes(q) ||
             (r.country||'').toLowerCase().includes(q);
    });

    document.getElementById('rp-count').textContent = filtered.length + ' мест';
    document.getElementById('rp-empty').style.display = filtered.length ? 'none' : 'block';

    if (currentView === 'table') renderTable();
    else renderCards();

    if (selectedId) showDetail(selectedId, false);
    else document.getElementById('rp-detail').className = 'rp-detail';
  };

  function placePhotoUrls(r){
    if (!r || !r.photo || !window.RotMediaRuntime) return null;
    try {
      return window.RotMediaRuntime.catalogAssetUrls('places', r.id, r.photo, {
        primaryOrigin: MEDIA_CDN,
        fallbackOrigin: MEDIA_CDN_FALLBACK
      });
    } catch (error) {
      console.warn('[place photo] ' + error.message);
      return null;
    }
  }

  document.addEventListener('error', function(event){
    var image = event.target;
    if (!image || image.tagName !== 'IMG' || !image.hasAttribute('data-place-photo')) return;
    var fallback = image.getAttribute('data-place-photo-fallback');
    image.removeAttribute('data-place-photo-fallback');
    if (fallback) image.src = fallback;
    else if (image.parentNode) image.parentNode.innerHTML = '<span class="rp-no-photo">NO PHOTO</span>';
  }, true);

  function photo(r){
    var urls = placePhotoUrls(r);
    if (urls) return '<img src="' + esc(urls.primary) + '" data-place-photo="1" data-place-photo-fallback="' + esc(urls.fallback) + '" alt="" loading="lazy">';
    return '<span class="rp-no-photo">NO PHOTO</span>';
  }

  function renderCards(){
    var c = document.getElementById('rp-container');
    if (!filtered.length){ c.innerHTML = ''; return; }
    c.innerHTML = filtered.map(function(r){
      var loc = [r.country, r.year].filter(Boolean).join(' · ');
      var cardClick = r.landing_url ? 'window.location.href=\'' + esc(r.landing_url) + '\'' : 'rpSelect(\'' + esc(r.id) + '\')';
      return '<div class="rp-card" onclick="' + cardClick + '">' +
        '<div class="rp-photo">' + photo(r) + '</div>' +
        '<div class="rp-body">' +
          '<div class="rp-name">' + esc(r.name||'') + '</div>' +
          '<div class="rp-loc">' + esc(loc) + '</div>' +
        '</div></div>';
    }).join('');
  }

  function renderTable(){
    var c = document.getElementById('rp-container');
    if (!filtered.length){ c.innerHTML = ''; return; }

    var cols = [
      { key:'name',    label:'Название' },
      { key:'country', label:'Страна' },
      { key:'year',    label:'Год' },
    ];

    var rows = filtered.slice().sort(function(a,b){
      var va = a[tblSort.col], vb = b[tblSort.col];
      if (va == null && vb == null) return 0;
      if (va == null) return 1; if (vb == null) return -1;
      if (typeof va === 'number') return tblSort.asc ? va-vb : vb-va;
      return tblSort.asc ? String(va).localeCompare(String(vb),'ru') : String(vb).localeCompare(String(va),'ru');
    });

    var thead = '<thead><tr>' + cols.map(function(col){
      var active = tblSort.col === col.key;
      var arrow  = active ? (tblSort.asc ? ' ▲' : ' ▼') : '';
      return '<th class="' + (active?'sorted':'') + '" onclick="rpTblSort(\'' + col.key + '\')">' + col.label + arrow + '</th>';
    }).join('') + '</tr></thead>';

    var tbody = '<tbody>' + rows.map(function(r){
      var sel = r.id === selectedId ? ' rp-selected' : '';
      var rowClick = r.landing_url ? 'window.location.href=\'' + esc(r.landing_url) + '\'' : 'rpSelect(\'' + esc(r.id) + '\')';
      return '<tr class="rp-row' + sel + '" onclick="' + rowClick + '">' +
        '<td class="rp-t-name">' + esc(r.name||'') + '</td>' +
        '<td class="rp-t-loc">' + esc(r.country||'') + '</td>' +
        '<td>' + (r.year||'') + '</td>' +
      '</tr>';
    }).join('') + '</tbody>';

    c.innerHTML = '<table class="rp-table">' + thead + tbody + '</table>';
  }

  window.rpTblSort = function(col){
    if (tblSort.col === col) tblSort.asc = !tblSort.asc;
    else { tblSort.col = col; tblSort.asc = true; }
    renderTable();
    if (selectedId) showDetail(selectedId, false);
  };

  window.rpSelect = function(id){
    if (selectedId === id) {
      selectedId = null;
      document.getElementById('rp-detail').className = 'rp-detail';
      if (currentView === 'table') renderTable();
      return;
    }
    selectedId = id;
    if (currentView === 'table') renderTable();
    showDetail(id, true);
  };

  function showDetail(id, scroll){
    var r = all.find(function(x){ return x.id === id; });
    if (!r) return;
    var meta = [];
    if (r.country)     meta.push(esc(r.country));
    if (r.year)        meta.push('📅 <b>' + r.year + '</b>');
    if (r.website)     meta.push('<a href="' + esc(r.website) + '" target="_blank" rel="noopener">🌐 Сайт</a>');
    if (r.map_url)     meta.push('<a class="map" href="' + esc(r.map_url) + '" target="_blank" rel="noopener">📍 Карта</a>');
    if (r.landing_url) meta.push('<a class="landing" href="' + esc(r.landing_url) + '" target="_blank" rel="noopener">📖 Читать</a>');

    var metaHtml = meta.length
      ? '<div class="rp-detail-meta">' + meta.join('<span class="sep"> · </span>') + '</div>'
      : '';

    var nameHtml = r.landing_url
      ? '<a class="rp-detail-name" href="' + esc(r.landing_url) + '" target="_blank" rel="noopener">' + esc(r.name||'') + '</a>'
      : '<div class="rp-detail-name">' + esc(r.name||'') + '</div>';

    var d = document.getElementById('rp-detail');
    d.innerHTML =
      '<div class="rp-detail-card">' +
        '<div class="rp-detail-photo">' + photo(r) + '</div>' +
        '<div class="rp-detail-body">' +
          nameHtml +
          metaHtml +
        '</div>' +
      '</div>';
    d.className = 'rp-detail open';
    if (scroll) d.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }

  function esc(s){
    return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
})();
//]]>
</script>
