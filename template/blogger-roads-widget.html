<style>
.rot-rw *, .rot-rw *::before, .rot-rw *::after { box-sizing: border-box; margin: 0; padding: 0; }
.rot-rw { font-family: 'PT Sans', sans-serif; color: #c8c0a8; }

.rot-rw .rw-card {
  background: #0d0d08; border: 1px solid #2a2510; border-radius: 4px;
  overflow: hidden; display: flex; flex-direction: row;
}

.rot-rw .rw-photo {
  width: 200px; min-width: 200px; background: #080806; overflow: hidden;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  align-self: stretch;
}
.rot-rw .rw-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rot-rw .rw-photo .rw-no-photo {
  font-family: 'Orbitron', sans-serif; font-size: 9px; color: #2a2510; letter-spacing: 2px;
}

.rot-rw .rw-body {
  padding: 16px 20px; display: flex; flex-direction: column; gap: 8px;
  flex: 1; min-width: 0;
}

@media (max-width: 520px) {
  .rot-rw .rw-card { flex-direction: column; }
  .rot-rw .rw-photo { width: 100%; min-width: 0; height: 160px; }
}

.rot-rw .rw-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #8a6f2e; }
.rot-rw .rw-name { font-size: 17px; font-weight: 700; color: #e0d8c0; line-height: 1.3; text-decoration: none; display: block; }
.rot-rw a.rw-name:hover { color: #f0e8d0; text-decoration: underline; }
.rot-rw .rw-meta {
  display: flex; flex-wrap: nowrap; align-items: baseline; gap: 0;
  font-size: 12px; color: #9a8c70;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rot-rw .rw-meta .sep { color: #3a3020; }
.rot-rw .rw-meta b { color: #c8c0a8; font-weight: normal; }
.rot-rw .rw-meta a { color: #c9a84c; text-decoration: none; }
.rot-rw .rw-meta a:hover { text-decoration: underline; }
.rot-rw .rw-meta a.landing { color: #a0c080; }
</style>

<div class="rot-rw" id="rot-rw-root"></div>

<script>
//<![CDATA[
(function(){
  var APP_CDN = 'https://cdn.roadsoftimes.com'; // code / html / json manifests
  fetch(APP_CDN + '/roads.json').then(function(r){ return r.json(); }).then(function(data){
    var r = data.find(function(x){ return x.featured; });
    if (!r) return;

    function esc(s){
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    var meta = [];
    if (r.country)     meta.push('<b>' + esc(r.country) + '</b>');
    if (r.year)        meta.push('📅 <b>' + r.year + '</b>');
    if (r.website)     meta.push('<a href="' + esc(r.website) + '" target="_blank" rel="noopener">🌐 Сайт</a>');
    if (r.landing_url) meta.push('<a class="landing" href="' + esc(r.landing_url) + '" target="_blank" rel="noopener">📖 Читать</a>');

    var metaHtml = meta.length
      ? '<div class="rw-meta">' + meta.join('<span class="sep"> · </span>') + '</div>'
      : '';

    document.getElementById('rot-rw-root').innerHTML =
      '<div class="rw-card">' +
        '<div class="rw-photo"><img src="' + esc(r.photo||'') + '" alt=""' + (r.photo ? '' : ' style="display:none"') + '></div>' +
        '<div class="rw-body">' +
          '<div class="rw-label">★ Рекомендую</div>' +
          (r.landing_url ? '<a class="rw-name" href="' + esc(r.landing_url) + '" target="_blank" rel="noopener">' + esc(r.name||'') + '</a>' : '<div class="rw-name">' + esc(r.name||'') + '</div>') +
          metaHtml +
        '</div>' +
      '</div>';
  });
})();
//]]>
</script>
