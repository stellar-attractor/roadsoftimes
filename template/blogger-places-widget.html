<style>
.rot-pw *, .rot-pw *::before, .rot-pw *::after { box-sizing: border-box; margin: 0; padding: 0; }
.rot-pw { font-family: 'PT Sans', sans-serif; color: #c8c0a8; }

.rot-pw .pw-card {
  background: #0d0d08; border: 1px solid #2a2510; border-radius: 4px;
  overflow: hidden; display: flex; flex-direction: row;
}

.rot-pw .pw-photo {
  width: 200px; min-width: 200px; background: #080806; overflow: hidden;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  align-self: stretch;
}
.rot-pw .pw-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.rot-pw .pw-photo .pw-no-photo {
  font-family: 'Orbitron', sans-serif; font-size: 9px; color: #2a2510; letter-spacing: 2px;
}

.rot-pw .pw-body {
  padding: 16px 20px; display: flex; flex-direction: column; gap: 8px;
  flex: 1; min-width: 0;
}

@media (max-width: 520px) {
  .rot-pw .pw-card { flex-direction: column; }
  .rot-pw .pw-photo { width: 100%; min-width: 0; height: 160px; }
}

.rot-pw .pw-label { font-size: 9px; letter-spacing: 2px; text-transform: uppercase; color: #8a6f2e; }
.rot-pw .pw-name { font-size: 17px; font-weight: 700; color: #e0d8c0; line-height: 1.3; text-decoration: none; display: block; }
.rot-pw a.pw-name:hover { color: #f0e8d0; text-decoration: underline; }
.rot-pw .pw-meta {
  display: flex; flex-wrap: nowrap; align-items: baseline; gap: 0;
  font-size: 12px; color: #9a8c70;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.rot-pw .pw-meta .sep { color: #3a3020; }
.rot-pw .pw-meta b { color: #c8c0a8; font-weight: normal; }
.rot-pw .pw-meta a { color: #c9a84c; text-decoration: none; }
.rot-pw .pw-meta a:hover { text-decoration: underline; }
.rot-pw .pw-meta a.map { color: #70b0a8; }
.rot-pw .pw-meta a.landing { color: #a0c080; }
.rot-pw .pw-desc {
  font-size: 13px; color: #a09880; line-height: 1.6;
  display: -webkit-box; -webkit-line-clamp: 4; line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
}
</style>

<div class="rot-pw" id="rot-pw-root"></div>

<script src="https://cdn.roadsoftimes.com/js/media-runtime.js?v=fe5"></script>
<script>
//<![CDATA[
(function(){
  var MEDIA_CDN = 'https://media.roadsoftimes.com';
  var MEDIA_CDN_FALLBACK = 'https://media-roadsoftimes.pages.dev';
  var DB_CDN = MEDIA_CDN + '/db'; // JSON catalogs (Epic #47)
  fetch(DB_CDN + '/places.json').then(function(r){ return r.json(); }).then(function(data){
    var r = data.find(function(p){ return p.featured; });
    if (!r) return;

    function esc(s){
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    var meta = [];
    if (r.country)     meta.push('<b>' + esc(r.country) + '</b>');
    if (r.year)        meta.push('📅 <b>' + r.year + '</b>');
    if (r.website)     meta.push('<a href="' + esc(r.website) + '" target="_blank" rel="noopener">🌐 Сайт</a>');
    if (r.map_url)     meta.push('<a class="map" href="' + esc(r.map_url) + '" target="_blank" rel="noopener">📍 Карта</a>');
    if (r.landing_url) meta.push('<a class="landing" href="' + esc(r.landing_url) + '" target="_blank" rel="noopener">📖 Читать</a>');

    var metaHtml = meta.length
      ? '<div class="pw-meta">' + meta.join('<span class="sep"> \u00B7 </span>') + '</div>'
      : '';
    var photoUrls = null;
    try {
      if (r.photo && window.RotMediaRuntime) photoUrls = window.RotMediaRuntime.catalogAssetUrls('places', r.id, r.photo, {
        primaryOrigin: MEDIA_CDN,
        fallbackOrigin: MEDIA_CDN_FALLBACK
      });
    } catch (error) {
      console.warn('[place widget photo] ' + error.message);
    }

    document.getElementById('rot-pw-root').innerHTML =
      '<div class="pw-card">' +
        '<div class="pw-photo"><img src="' + esc(photoUrls ? photoUrls.primary : '') + '" data-place-photo-fallback="' + esc(photoUrls ? photoUrls.fallback : '') + '" alt=""' + (photoUrls ? '' : ' style="display:none"') + '></div>' +
        '<div class="pw-body">' +
          '<div class="pw-label">★ Рекомендую</div>' +
          (r.landing_url ? '<a class="pw-name" href="' + esc(r.landing_url) + '" target="_blank" rel="noopener">' + esc(r.name||'') + '</a>' : '<div class="pw-name">' + esc(r.name||'') + '</div>') +
          metaHtml +
          (r.description ? '<div class="pw-desc">' + esc(r.description) + '</div>' : '') +
        '</div>' +
      '</div>';
    var photo = document.querySelector('#rot-pw-root .pw-photo img');
    if (photo) photo.addEventListener('error', function(){
      var fallback = photo.getAttribute('data-place-photo-fallback');
      photo.removeAttribute('data-place-photo-fallback');
      if (fallback) photo.src = fallback;
      else photo.style.display = 'none';
    });
  });
})();
//]]>
</script>
